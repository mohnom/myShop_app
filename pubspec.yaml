name: myshop
description: "بقالتي — نظام رقمي ذكي لإدارة حسابات وديون البقالات والعملاء لحظياً."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  flutter_localization: ^0.3.3
  google_fonts: ^8.0.2
  flutter_bloc: ^9.1.1
  awesome_snackbar_content: ^0.1.8
  font_awesome_flutter: ^11.0.0
  flutter_spinkit: ^5.2.2
  go_router: ^17.1.0
  shared_preferences: ^2.5.4
  audioplayers: ^6.7.1
  url_launcher: ^6.3.3
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  entrig: ^1.0.9
  permission_handler: ^11.3.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - images/logo.png
    - assets/sound/succes.mp3

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/font/Tajawal/Tajawal-Regular.ttf
        - asset: assets/font/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/font/Tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/font/Tajawal/Tajawal-ExtraBold.ttf
          weight: 800

    - family: Cairo
      fonts:
        - asset: assets/font/Cairo/Cairo-Regular.ttf
        - asset: assets/font/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/font/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/font/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/font/Cairo/Cairo-ExtraBold.ttf
          weight: 800
